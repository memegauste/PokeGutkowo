[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["pokegutkowo"]

[tool.ruff]
line-length = 99
target-version = "py315"
extend-exclude = ["migrations", "settings_local.py", "venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
